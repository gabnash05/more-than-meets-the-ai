name: more-than-meets-the-ai

services:
  web:
    image: ${WEB_IMAGE:-mmtai-web}:${IMAGE_TAG:-local}
    build:
      context: ..
      dockerfile: deploy/web.Dockerfile
    ports:
      - "${WEB_BIND:-127.0.0.1:8080}:8080"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/room/"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    image: ${API_IMAGE:-mmtai-api}:${IMAGE_TAG:-local}
    build:
      context: ..
      dockerfile: deploy/api.Dockerfile
      target: ${API_TARGET:-base}
    environment:
      HOST: 0.0.0.0
      PORT: 3001
      ROOM_STORE: ${ROOM_STORE:-memory}
      WEB_ORIGINS: ${WEB_ORIGINS:-http://127.0.0.1:8080}
      DATABASE_URL: ${DATABASE_URL:-}
      AI_SERVICE_URL: ${AI_SERVICE_URL:-}
      AI_PRIVATE_LINK: ${AI_PRIVATE_LINK:-0}
      AI_RENDERER_URL: http://web:8080/review/canvas/
      AI_SECRET_FILE: /run/mmtai-secrets/ai-token
      GUESSER_PROVIDER: ${GUESSER_PROVIDER:-unavailable}
      REFEREE_PROVIDER: ${REFEREE_PROVIDER:-unavailable}
      GUESSER_MODEL_ID: ${GUESSER_MODEL_ID:-}
      REFEREE_MODEL_ID: ${REFEREE_MODEL_ID:-}
      AI_SMOKE_TEST: ${AI_SMOKE_TEST:-0}
      AI_TEST_FIXTURES: ${AI_TEST_FIXTURES:-0}
    volumes:
      - type: bind
        source: ${AI_SECRETS_DIR:-../.local/ai-secrets}
        target: /run/mmtai-secrets
        read_only: true
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      start_period: 10s
      retries: 5

  ai:
    profiles: [ai]
    image: ${AI_IMAGE:-mmtai-inference}:${IMAGE_TAG:-local}
    build:
      context: ..
      dockerfile: deploy/ai.Dockerfile
      args:
        AI_RUNTIME: ${AI_RUNTIME:-litert}
    environment:
      AI_SECRET_FILE: /run/mmtai-secrets/ai-token
      AI_ARTIFACT_ROOT: /artifacts
      GUESSER_MODEL_ID: ${GUESSER_MODEL_ID:-}
      REFEREE_MODEL_ID: ${REFEREE_MODEL_ID:-}
      AI_SMOKE_TEST: ${AI_SMOKE_TEST:-0}
      AI_TEST_FIXTURES: ${AI_TEST_FIXTURES:-0}
    volumes:
      - type: bind
        source: ${AI_SECRETS_DIR:-../.local/ai-secrets}
        target: /run/mmtai-secrets
        read_only: true
      - type: bind
        source: ${AI_ARTIFACT_DIR:-../.local/ai-artifacts}
        target: /artifacts
        read_only: true
    cpus: 1.0
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/live', timeout=2).close()"]
      interval: 10s
      timeout: 3s
      retries: 5
