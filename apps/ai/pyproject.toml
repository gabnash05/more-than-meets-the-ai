[project]
name = "mmtai-inference"
version = "0.1.0"
requires-python = ">=3.13,<3.14"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "python-multipart>=0.0.20,<1",
  "pillow>=13,<14",
  "numpy>=1.26,<3",
  "ai-edge-litert==2.3.0",
]

[project.optional-dependencies]
vit = ["torch>=2.9,<3", "torchvision>=0.24,<1", "timm>=1,<2", "safetensors>=0.5,<1", "opencv-python-headless>=4.11,<5"]

[dependency-groups]
dev = ["httpx>=0.28,<1", "pytest>=8,<10"]

[tool.uv]
package = false
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'", "sys_platform == 'win32' and platform_machine == 'AMD64'"]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
