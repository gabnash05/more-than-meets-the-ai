[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "referee-data"
version = "0.1.0"
description = "CPU-only ATYPICT preparation and Referee canvas loading"
requires-python = ">=3.13,<3.14"
dependencies = ["guesser-data", "numpy", "pillow"]

[project.scripts]
referee-data = "referee_data.cli:main"

[tool.uv.sources]
guesser-data = { path = "../../guesser/data" }

[tool.setuptools]
packages = ["referee_data"]
package-dir = { referee_data = "src" }

[dependency-groups]
dev = ["pyright>=1.1.414", "pytest>=9.2.0", "ruff>=0.17.3"]

[tool.ruff]
target-version = "py313"
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.pyright]
include = ["src"]
pythonVersion = "3.13"
typeCheckingMode = "basic"
venvPath = "."
venv = ".venv"
