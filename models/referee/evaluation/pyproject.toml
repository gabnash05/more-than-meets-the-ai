[project]
name = "mtmai-referee-evaluation"
version = "0.1.0"
description = "Cross-platform notebook environment for Referee evaluation"
requires-python = ">=3.12,<3.13"
dependencies = []

[dependency-groups]
notebook = [
    "ipykernel>=6.29,<7",
    "jupyterlab>=4.4,<5",
    "matplotlib>=3.10,<4",
    "nbconvert>=7.16,<8",
    "numpy>=2.2,<3",
    "pandas>=2.3,<3",
    "pillow>=13,<14",
]
dev = [
    "nbdime>=4,<5",
    "nbstripout>=0.8,<1",
    "pre-commit>=4,<5",
    "pytest>=9.0.3,<10",
    "ruff>=0.14,<1",
]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/referee_evaluation"]

[tool.uv]
default-groups = ["notebook", "dev"]

[tool.ruff]
line-length = 100
target-version = "py312"
