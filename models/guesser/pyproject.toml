[project]
name = "guesser"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "guesser-data",
    "lightning>=2.6.6",
    "safetensors>=0.8.0",
    "timm>=1.0.31",
    "torch",
    "torchvision",
    "torchmetrics>=1.9.0",
]

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.uv.sources]
# Reuse the loader without sharing the CPU-only data project's environment.
guesser-data = { path = "data", editable = true }
torch = [{ index = "pytorch-cu126", marker = "sys_platform == 'win32'" }]
torchvision = [{ index = "pytorch-cu126", marker = "sys_platform == 'win32'" }]