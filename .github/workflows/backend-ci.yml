name: Backend CI

on:
  pull_request:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Backend checks and PostgreSQL tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/api
    # Only the ephemeral runner's guarded test database is reachable on this port.
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: mtmai
          POSTGRES_DB: mtmai_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 127.0.0.1:55437:5432
        options: >-
          --health-cmd "pg_isready -U mtmai -d mtmai_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://mtmai@127.0.0.1:55437/mtmai_test
      TEST_DATABASE_URL: postgresql://mtmai@127.0.0.1:55437/mtmai_test
      GUESSER_PROVIDER: unavailable
      REFEREE_PROVIDER: unavailable
      AI_SMOKE_TEST: '0'
      AI_TEST_FIXTURES: '0'
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js 24.22.2
        id: node
        uses: actions/setup-node@v7
        with:
          node-version: 24.22.2
          cache: npm
          cache-dependency-path: apps/api/package-lock.json

      - name: Install dependencies
        id: install_deps
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Save npm download cache before checks
        if: steps.node.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ~/.npm
          key: ${{ steps.node.outputs.cache-primary-key }}

      - name: Generate Prisma client
        id: generate
        if: ${{ !cancelled() && steps.install_deps.outcome == 'success' }}
        run: npm run prisma:generate

      - name: Migrate isolated test database
        id: migrate
        if: ${{ !cancelled() && steps.generate.outcome == 'success' }}
        run: npm run db:migrate

      # Independent checks still run after another check fails; failures stay fatal.
      - name: Typecheck
        id: typecheck
        if: ${{ !cancelled() && steps.generate.outcome == 'success' }}
        run: npm run typecheck

      - name: Lint
        id: lint
        if: ${{ !cancelled() && steps.install_deps.outcome == 'success' }}
        run: npm run lint

      - name: Production build
        id: build
        if: ${{ !cancelled() && steps.generate.outcome == 'success' }}
        run: npm run build

      - name: Run complete backend suite
        id: tests
        if: ${{ !cancelled() && steps.build.outcome == 'success' && steps.migrate.outcome == 'success' }}
        run: npm test

      - name: Report backend outcomes
        if: always()
        env:
          INSTALL_RESULT: ${{ steps.install_deps.outcome || 'skipped' }}
          GENERATE_RESULT: ${{ steps.generate.outcome || 'skipped' }}
          MIGRATE_RESULT: ${{ steps.migrate.outcome || 'skipped' }}
          TYPECHECK_RESULT: ${{ steps.typecheck.outcome || 'skipped' }}
          LINT_RESULT: ${{ steps.lint.outcome || 'skipped' }}
          BUILD_RESULT: ${{ steps.build.outcome || 'skipped' }}
          TEST_RESULT: ${{ steps.tests.outcome || 'skipped' }}
        run: |
          {
            echo '## Backend checks'
            echo '| Check | Result |'
            echo '| --- | --- |'
            echo "| Install dependencies | $INSTALL_RESULT |"
            echo "| Prisma generation | $GENERATE_RESULT |"
            echo "| Test database migration | $MIGRATE_RESULT |"
            echo "| Typecheck | $TYPECHECK_RESULT |"
            echo "| Lint | $LINT_RESULT |"
            echo "| Production build | $BUILD_RESULT |"
            echo "| Backend tests | $TEST_RESULT |"
          } >> "$GITHUB_STEP_SUMMARY"

  inference:
    name: Inference service tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/ai
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python 3.13.18
        uses: actions/setup-python@v6
        with:
          python-version: 3.13.18

      - name: Install uv
        run: python -m pip install --disable-pip-version-check uv==0.13.7

      - name: Sync locked CPU ViT and test dependencies
        run: uv sync --frozen --extra vit --group dev

      - name: Run inference service tests
        env:
          PYTHONPATH: ../..
        run: uv run --frozen --no-sync python -m pytest -q tests
