name: Container images

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Do not interrupt an in-progress release halfway through its two image builds.
concurrency:
  group: container-images-${{ github.ref }}
  cancel-in-progress: false

jobs:
  frontend:
    name: Frontend CI
    uses: ./.github/workflows/frontend-ci.yml

  backend:
    name: Backend CI
    uses: ./.github/workflows/backend-ci.yml

  publish:
    name: Publish ${{ matrix.image }} image
    needs: [frontend, backend]
    # Manual dispatch on another branch may validate it, but cannot publish it.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: api
            dockerfile: deploy/api.Dockerfile
            target: base
          - image: web
            dockerfile: deploy/web.Dockerfile
            target: ''
    steps:
      - name: Check out tested commit
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Derive commit-specific image reference
        id: image
        env:
          IMAGE: ${{ matrix.image }}
        # Repository/commit come from GitHub's fixed execution context, not PR text.
        # Lowercase the registry path, then use one full commit tag for both images.
        run: |
          name="ghcr.io/${GITHUB_REPOSITORY,,}-$IMAGE"
          printf 'name=%s\nreference=%s:sha-%s\n' "$name" "$name" "$GITHUB_SHA" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR with the job token
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          target: ${{ matrix.target }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.image.outputs.reference }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=mmtai-${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=mmtai-${{ matrix.image }}

      - name: Record published reference and digest
        env:
          IMAGE_REFERENCE: ${{ steps.image.outputs.reference }}
          IMAGE_NAME: ${{ steps.image.outputs.name }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          {
            echo '## Published container'
            printf '\nTag: `%s`\n\nDigest: `%s@%s`\n' "$IMAGE_REFERENCE" "$IMAGE_NAME" "$DIGEST"
            echo 'Deploy only after the whole workflow succeeds, using matching commit tags.'
            echo 'Re-running a commit can rebuild a tag; use the digest for immutable pinning.'
          } >> "$GITHUB_STEP_SUMMARY"
