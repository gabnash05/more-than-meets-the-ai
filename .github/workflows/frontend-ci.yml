name: Frontend CI

on:
  pull_request:
  # Main pushes call this workflow from container-images.yml before publishing.
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frontend-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Frontend checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/web
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js 24.22.2
        id: node
        uses: actions/setup-node@v7
        with:
          node-version: 24.22.2
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        id: install_deps
        run: npm ci --prefer-offline --no-audit --no-fund

      # setup-node's post-job cache save is skipped when a later check fails.
      - name: Save npm download cache before checks
        if: steps.node.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ~/.npm
          key: ${{ steps.node.outputs.cache-primary-key }}

      - name: Typecheck
        id: typecheck
        if: ${{ !cancelled() && steps.install_deps.outcome == 'success' }}
        run: npm run typecheck

      - name: Lint
        id: lint
        if: ${{ !cancelled() && steps.install_deps.outcome == 'success' }}
        run: npm run lint

      - name: Run unit tests
        id: unit_tests
        if: ${{ !cancelled() && steps.install_deps.outcome == 'success' }}
        run: npm test

      - name: Report check outcomes
        if: always()
        env:
          INSTALL_DEPS_RESULT: ${{ steps.install_deps.outcome || 'skipped' }}
          TYPECHECK_RESULT: ${{ steps.typecheck.outcome || 'skipped' }}
          LINT_RESULT: ${{ steps.lint.outcome || 'skipped' }}
          UNIT_TESTS_RESULT: ${{ steps.unit_tests.outcome || 'skipped' }}
        run: |
          {
            echo "## Frontend checks"
            echo "| Check | Result |"
            echo "| --- | --- |"
            echo "| Install dependencies | $INSTALL_DEPS_RESULT |"
            echo "| Typecheck | $TYPECHECK_RESULT |"
            echo "| Lint | $LINT_RESULT |"
            echo "| Unit tests | $UNIT_TESTS_RESULT |"
          } >> "$GITHUB_STEP_SUMMARY"

  browser:
    name: Production build and browser tests
    # No dependency on checks: lint failures must not block browser coverage.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/web
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js 24.22.2
        id: node
        uses: actions/setup-node@v7
        with:
          node-version: 24.22.2
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        id: install_deps
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Save npm download cache before checks
        if: steps.node.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ~/.npm
          key: ${{ steps.node.outputs.cache-primary-key }}

      - name: Restore Next.js build cache
        id: next_cache
        uses: actions/cache/restore@v6
        with:
          path: apps/web/.next/cache
          key: ${{ runner.os }}-${{ runner.arch }}-next-node24-v1-${{ hashFiles('apps/web/package-lock.json') }}-${{ hashFiles('apps/web/src/**', 'apps/web/public/**', 'apps/web/*config*', 'apps/web/tsconfig.json') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-next-node24-v1-${{ hashFiles('apps/web/package-lock.json') }}-

      - name: Build
        id: build
        if: ${{ !cancelled() && steps.install_deps.outcome == 'success' }}
        run: npm run build

      - name: Save successful build cache before browser tests
        if: ${{ !cancelled() && steps.build.outcome == 'success' && steps.next_cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v6
        with:
          path: apps/web/.next/cache
          key: ${{ steps.next_cache.outputs.cache-primary-key }}

      - name: Ensure Chrome is available
        id: install_chrome
        if: ${{ !cancelled() && steps.install_deps.outcome == 'success' && steps.build.outcome == 'success' }}
        run: |
          if ! node --input-type=module -e 'import { chromium } from "@playwright/test"; const browser = await chromium.launch({ channel: "chrome" }); console.log(`Chrome ${browser.version()}`); await browser.close();'; then
            npx playwright install --with-deps chrome
          fi

      - name: Run browser tests
        id: browser_tests
        if: ${{ !cancelled() && steps.install_chrome.outcome == 'success' }}
        run: npm run test:e2e

      - name: Upload browser failure evidence
        if: ${{ !cancelled() && steps.browser_tests.outcome == 'failure' }}
        uses: actions/upload-artifact@v7
        with:
          name: browser-failure-evidence
          path: apps/web/test-results/
          retention-days: 7
          compression-level: 0
          if-no-files-found: warn

      - name: Report browser outcomes
        if: always()
        env:
          INSTALL_DEPS_RESULT: ${{ steps.install_deps.outcome || 'skipped' }}
          BUILD_RESULT: ${{ steps.build.outcome || 'skipped' }}
          CHROME_RESULT: ${{ steps.install_chrome.outcome || 'skipped' }}
          BROWSER_TESTS_RESULT: ${{ steps.browser_tests.outcome || 'skipped' }}
        run: |
          {
            echo "## Production build and browser tests"
            echo "| Check | Result |"
            echo "| --- | --- |"
            echo "| Install dependencies | $INSTALL_DEPS_RESULT |"
            echo "| Build | $BUILD_RESULT |"
            echo "| Install Chrome | $CHROME_RESULT |"
            echo "| Browser tests | $BROWSER_TESTS_RESULT |"
          } >> "$GITHUB_STEP_SUMMARY"
